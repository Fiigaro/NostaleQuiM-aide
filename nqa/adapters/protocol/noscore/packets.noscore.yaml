# ============================================================================
# NosCore packet map -- derived from NosCore.Packets source (MIT).
# ============================================================================
#
# Indices here are 1-based counting from AFTER the header, which is this
# project's convention. NosCore's own [PacketIndex(n)] attribute is 0-based, so
# every index below is the source's n + 1. The source class is named in each
# comment so you can re-derive it.
#
# CONFIRMED against source: st, mv, out, in (flat fields), u_s.
# See STATUS.md for the packets that need sub-field parsing (bf, the in-*
# subpackets) and the outgoing commands that need computed fields
# (walk checksum, u_i slot, self-cast target id).
#
# VisualType (NosCore.Shared): Map=0 Player=1 Npc=2 Monster=3 Object=9
# ============================================================================

incoming:
  # StPacket "st {Type} {VisualId} {Level} {HeroLvl} {HpPct} {MpPct}
  #             {CurHp} {CurMp} {MaxHp} {MaxMp} {Unknown1} {BuffIds...}"
  # Our own stats: Type == Player(1).
  stats:
    header: "st"
    when: {1: "1"}
    fields: {hp: 7, hp_max: 9, mp: 8, mp_max: 10}
  # Same header for a monster: Type == Monster(3) -> live HP% update.
  entity_hp:
    header: "st"
    when: {1: "3"}
    fields: {id: 2, hp_pct: 5}

  # MovePacket "mv {VisualType} {VisualEntityId} {MapX} {MapY} {Speed}"
  self_moved:
    header: "mv"
    when: {1: "1"}
    fields: {x: 3, y: 4}
  entity_moved:
    header: "mv"
    when: {1: "3"}
    fields: {id: 2, x: 3, y: 4}

  # OutPacket "out {VisualType} {VisualId}" -- dropping any despawned entity is safe.
  entity_despawn:
    header: "out"
    fields: {id: 2}

  # InPacket "in {VisualType} {Name?} {VNum} {VisualId} {PosX} {PosY} {Dir?} {subs...}"
  # Monster spawn: Type == Monster(3). Level and HP% live in InNonPlayerSubPacket
  # (a nested field), so they are not mapped here; st/bf update them live.
  # NOTE: Name (index 2) is optional in the source. This mapping assumes the
  # server emits it (even as an empty token) for monsters; if a build omits it,
  # every field after shifts by one. Verify against one real 'in' line.
  entity_spawn:
    header: "in"
    when: {1: "3"}
    fields: {vnum: 3, id: 4, x: 5, y: 6}

outgoing:
  # UseSkillPacket "u_s {CastId} {TargetVisualType} {TargetId}". Target a
  # monster -> VisualType 3. CastId is the skill's cast id (from the skill
  # table), not its vnum.
  use_skill: "u_s {skill_id} 3 {target_id}"

  # These need values a static template cannot supply -- see STATUS.md:
  #   move          walk {x} {y} {checksum} {speed}   checksum = (x+y) % 3 % 2
  #   use_item      u_i 1 {self_id} 1 {slot} 0        slot from inventory, not vnum
  #   use_skill_self u_s {skill_id} 1 {self_id}       own character id as target
  # Leaving them undefined makes the adapter raise a clear SpecError if called,
  # rather than sending a malformed packet.
